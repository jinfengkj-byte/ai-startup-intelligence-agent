[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-startup-radar"
version = "0.2.0"
description = "Track what changed across AI startups with source-linked signals and a local watchlist"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "jinfengkj-byte"}]
dependencies = []

[project.scripts]
startup-radar = "startup_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
