[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-startup-intelligence-agent"
version = "0.1.0"
description = "Source-linked startup intelligence from RSS and Atom feeds"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "jinfengkj-byte"}]
dependencies = []

[project.scripts]
startup-intel = "startup_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
